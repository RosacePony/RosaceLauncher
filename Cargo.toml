[package]
name = "rosace-launcher"
version = "0.5.0"
description = "Rosace Launcher"
edition = "2021"

[build-dependencies]
winresource = "0.1"

[dependencies]
iced = { version = "0.14", features = ["tokio", "image"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "process"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
regex = "1"
sha2 = "0.10"
minisign-verify = "0.2"
base64 = "0.22"
include_dir = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
